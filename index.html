<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lays Configurator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <img src="./public/models/ar-lays-big-change-ar-lays-4x3-d080a2f7f0aa45bbab0fccd2078b7152.jpg" class="logo" alt="Lays logo" />

    
  </header>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR CONTROLS -->
    <aside class="controls">
      <h2>Create your bag</h2>


      <label>Bag color</label>
      <input type="color" id="bagColor" value="#d9d9d9" />
<label>Text on bag</label>
<input id="bagText" type="text" placeholder="Your text here" />

<label>Font</label>
<select id="fontSelect">
  <option value="bold 80px Arial">Bold</option>
  <option value="italic 80px Arial">Italic</option>
  <option value="80px Arial">Regular</option>
  <option value="bold 80px Comic Sans MS">Comic</option>
</select>

<label>Upload image</label>
<input id="imageUpload" type="file" accept="image/*" />

      <label>Chips type</label>
      <select id="chipsSelect">
        <option value="">Select chips type</option>
        <option value="plain">Plain</option>
        <option value="ribbed">Ribbed</option>
        <option value="thick">Thick</option>
      </select>

      <label>Design</label>
      <select id="designSelect">
        <option value="">Select design</option>
        <option value="circles">Circles</option>
        <option value="squares">Squares</option>
        <option value="spiral">Spiral</option>
      </select>

      <label>Bag type</label>
      <select id="bagSelect">
        <option value="classic">Classic</option>
        <option value="bbq">BBQ</option>
        <option value="paprika">Paprika</option>
      </select>

      <button id="saveDesign" class="primary">
        Save design
      </button>
    </aside>

    <!-- THREEJS VIEW -->
    <main class="viewer"></main>

  </div>

  <!-- THREEJS -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
